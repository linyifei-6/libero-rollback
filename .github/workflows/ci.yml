name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: lint + tests + static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      - name: Install package (dev extras)
        run: uv sync --extra dev

      - name: Local CI mirror (ruff, pytest, dataset validation, independence guards)
        run: bash scripts/ci_check.sh
